<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste-to-Reuse Recommendation Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .input-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .input-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .material-input, .json-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
            font-family: monospace;
        }

        .json-input {
            min-height: 150px;
            resize: vertical;
        }

        .material-input:focus, .json-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .suggestion-chip {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #c33;
            margin-top: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .guide-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .guide-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .guide-title {
            font-size: 1.8rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .material-badge {
            display: inline-block;
            padding: 5px 15px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .hazardous-badge {
            background: #dc3545;
        }

        .guide-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
        }

        .meta-item strong {
            color: #333;
        }

        .section {
            margin: 25px 0;
        }

        .section-title {
            font-size: 1.3rem;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-box h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .info-box ul, .info-box ol {
            margin-left: 20px;
            color: #555;
        }

        .info-box li {
            margin: 5px 0;
        }

        .steps-list {
            list-style: none;
            counter-reset: step-counter;
        }

        .steps-list li {
            counter-increment: step-counter;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            position: relative;
            padding-left: 50px;
        }

        .steps-list li::before {
            content: counter(step-counter);
            position: absolute;
            left: 15px;
            top: 15px;
            background: #667eea;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .safety-warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }

        .safety-warning strong {
            color: #856404;
        }

        .youtube-links {
            list-style: none;
        }

        .youtube-links li {
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .youtube-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .youtube-links a:hover {
            text-decoration: underline;
        }

        .sources-list {
            list-style: none;
        }

        .sources-list li {
            margin: 5px 0;
            padding: 5px 0;
        }

        .sources-list a {
            color: #667eea;
            text-decoration: none;
        }

        .sources-list a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .input-group {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
            }

            .guide-meta {
                flex-direction: column;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>♻️ Waste-to-Reuse Recommendation Agent</h1>
            <p>Generate practical, step-by-step reusable product guides from waste materials</p>
        </div>

        <div class="input-section">
            <div class="input-tabs">
                <button class="tab active" onclick="switchTab('manual')">Manual Entry</button>
                <button class="tab" onclick="switchTab('classification')">Classification Response</button>
                <button class="tab" onclick="switchTab('localStorage')">From Local Storage</button>
            </div>

            <div id="manualTab" class="tab-content active">
                <div class="input-group">
                    <input 
                        type="text" 
                        class="material-input" 
                        id="materialInput" 
                        placeholder="Enter waste materials separated by commas (e.g., paper, plastic, glass)"
                        autocomplete="off"
                    >
                    <button class="search-btn" onclick="processWasteMaterials()">Generate Guides</button>
                </div>
                <div class="suggestions">
                    <span style="color: #666; margin-right: 10px;">Quick select:</span>
                    <button class="suggestion-chip" onclick="addMaterial('paper')">Paper</button>
                    <button class="suggestion-chip" onclick="addMaterial('cardboard')">Cardboard</button>
                    <button class="suggestion-chip" onclick="addMaterial('glass')">Glass</button>
                    <button class="suggestion-chip" onclick="addMaterial('metal')">Metal</button>
                    <button class="suggestion-chip" onclick="addMaterial('plastic')">Plastic</button>
                </div>
            </div>

            <div id="classificationTab" class="tab-content">
                <textarea 
                    class="json-input" 
                    id="classificationInput" 
                    placeholder='Paste classification API response here, e.g.:
{
  "prediction": {
    "label": "paper",
    "confidence": 0.6143782734870911,
    "top": [
      {"label": "paper", "confidence": 0.6143782734870911},
      {"label": "glass", "confidence": 0.1518249660730362}
    ]
  }
}'
                ></textarea>
                <button class="search-btn" style="margin-top: 15px; width: 100%;" onclick="processClassificationResponse()">Process Classification</button>
            </div>

            <div id="localStorageTab" class="tab-content">
                <p style="margin-bottom: 15px; color: #666;">Waste materials will be retrieved from localStorage key: <strong>waste_list</strong></p>
                <button class="search-btn" style="width: 100%;" onclick="processFromLocalStorage()">Load from Local Storage</button>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating reuse guides...</p>
            </div>
        </div>

        <div class="results-section" id="resultsSection">
            <!-- Guides will be inserted here -->
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            
            // Show selected tab
            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        function addMaterial(material) {
            const input = document.getElementById('materialInput');
            const current = input.value.trim();
            if (current && !current.endsWith(',')) {
                input.value = current + ', ' + material;
            } else {
                input.value = current + material;
            }
        }

        function getWasteItemsFromInput() {
            const input = document.getElementById('materialInput').value.trim();
            if (!input) return [];
            return input.split(',').map(item => item.trim()).filter(item => item);
        }

        async function processWasteMaterials() {
            const wasteItems = getWasteItemsFromInput();
            if (wasteItems.length === 0) {
                showError('Please enter at least one waste material');
                return;
            }
            await fetchReuseGuides({ waste_items: wasteItems });
        }

        async function processClassificationResponse() {
            const input = document.getElementById('classificationInput').value.trim();
            if (!input) {
                showError('Please paste the classification API response');
                return;
            }
            
            try {
                const classificationData = JSON.parse(input);
                await fetchReuseGuides(classificationData);
            } catch (e) {
                showError('Invalid JSON format. Please check your classification response.');
            }
        }

        async function processFromLocalStorage() {
            try {
                const wasteList = localStorage.getItem('waste_list');
                if (!wasteList) {
                    showError('No waste_list found in localStorage. Please store waste items first.');
                    return;
                }
                
                const wasteItems = JSON.parse(wasteList);
                await fetchReuseGuides({ waste_items: wasteItems });
            } catch (e) {
                showError('Error reading from localStorage: ' + e.message);
            }
        }

        async function fetchReuseGuides(requestData) {
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('errorMessage').classList.remove('active');
            document.getElementById('loading').classList.add('active');

            try {
                const response = await fetch('/api/reuse-guides', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();
                document.getElementById('loading').classList.remove('active');

                if (!response.ok) {
                    showError(data.message || data.error || 'An error occurred');
                    return;
                }

                displayGuides(data.guides);
            } catch (error) {
                document.getElementById('loading').classList.remove('active');
                showError('Failed to fetch guides. Please make sure the server is running.');
                console.error('Error:', error);
            }
        }

        function displayGuides(guides) {
            const resultsSection = document.getElementById('resultsSection');
            resultsSection.innerHTML = '';

            if (guides.length === 0) {
                showError('No guides generated');
                return;
            }

            guides.forEach(guide => {
                const isHazardous = guide.material === 'battery' || guide.material === 'e-waste' || 
                                   guide.material.includes('battery') || guide.material.includes('e-waste');
                
                const guideCard = document.createElement('div');
                guideCard.className = 'guide-card';
                
                guideCard.innerHTML = `
                    <div class="guide-header">
                        <div>
                            <span class="material-badge ${isHazardous ? 'hazardous-badge' : ''}">${guide.material}</span>
                            <h2 class="guide-title">${guide.suggested_product}</h2>
                            <p style="color: #666; margin-top: 10px;">${guide.purpose}</p>
                        </div>
                    </div>
                    
                    <div class="guide-meta">
                        <div class="meta-item">
                            <strong>Difficulty:</strong> <span style="text-transform: capitalize;">${guide.difficulty}</span>
                        </div>
                        <div class="meta-item">
                            <strong>Time:</strong> ${guide.estimated_time_minutes} minutes
                        </div>
                        <div class="meta-item">
                            <strong>Cost:</strong> ${guide.approx_cost_estimate}
                        </div>
                    </div>

                    ${guide.safety_notes ? `
                        <div class="safety-warning">
                            <strong>⚠️ Safety Notes:</strong> ${guide.safety_notes}
                        </div>
                    ` : ''}

                    <div class="section">
                        <h3 class="section-title">Materials Needed</h3>
                        <div class="info-box">
                            <ul>
                                ${guide.materials_needed.map(item => `<li>${item}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="section">
                        <h3 class="section-title">Tools Required</h3>
                        <div class="info-box">
                            <ul>
                                ${guide.tools_required.map(tool => `<li>${tool}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="section">
                        <h3 class="section-title">Step-by-Step Instructions</h3>
                        <ol class="steps-list">
                            ${guide.step_by_step_instructions.map(step => `<li>${step}</li>`).join('')}
                        </ol>
                    </div>

                    ${guide.potential_yield_or_sale_idea ? `
                        <div class="section">
                            <h3 class="section-title">Potential Yield / Sale Ideas</h3>
                            <div class="info-box">
                                <p>${guide.potential_yield_or_sale_idea}</p>
                            </div>
                        </div>
                    ` : ''}

                    ${guide.youtube_tutorials && guide.youtube_tutorials.length > 0 ? `
                        <div class="section">
                            <h3 class="section-title">YouTube Tutorials</h3>
                            <ul class="youtube-links">
                                ${guide.youtube_tutorials.map(tutorial => `
                                    <li>
                                        <a href="${tutorial.url}" target="_blank">${tutorial.title || tutorial.url}</a>
                                        ${tutorial.description ? `<p style="color: #666; font-size: 0.9rem; margin-top: 5px;">${tutorial.description}</p>` : ''}
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    ` : ''}

                    ${guide.sources && guide.sources.length > 0 ? `
                        <div class="section">
                            <h3 class="section-title">Sources</h3>
                            <ul class="sources-list">
                                ${guide.sources.map(source => {
                                    if (source.startsWith('http')) {
                                        return `<li><a href="${source}" target="_blank">${source}</a></li>`;
                                    }
                                    return `<li>${source}</li>`;
                                }).join('')}
                            </ul>
                        </div>
                    ` : ''}
                `;
                
                resultsSection.appendChild(guideCard);
            });

            resultsSection.classList.add('active');
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
        }

        // Allow Enter key in material input
        document.getElementById('materialInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                processWasteMaterials();
            }
        });
    </script>
</body>
</html>
