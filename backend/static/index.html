<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Recycle System</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

<div class="container">

    <h1>♻️ Smart Recycle System</h1>
    <p class="subtitle">Upload an image to classify the waste material</p>

    <div class="upload-box">
        <input type="file" id="imageInput" accept="image/*">
        <img id="preview" src="" alt="Preview">
    </div>

    <button id="predictBtn" type="button">Predict</button>

    <div id="loading" class="loading hidden">Processing...</div>

    <div id="result" class="result hidden">
        <h2>Prediction Result</h2>
        <p id="predictedLabel"></p>

        <h3>Confidence Levels</h3>
        <div id="confidenceBars"></div>

        <h3>Recycling Suggestion</h3>
        <p id="suggestion"></p>
    </div>

</div>

<script src="static/script.js" defer></script>
</body>
</html>
